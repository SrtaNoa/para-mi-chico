<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para el chico más bonito</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d131a;
      font-family: 'Georgia', serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenedor del video de fondo */
    .escena-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    /* Estilos para el video en pantalla completa */
    .video-fondo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Red del Animus */
    .animus-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(0deg, transparent 24%, rgba(255, 105, 180, 0.05) 25%, rgba(255, 105, 180, 0.05) 26%, transparent 27%),
        linear-gradient(90deg, transparent 24%, rgba(255, 105, 180, 0.05) 25%, rgba(255, 105, 180, 0.05) 26%, transparent 27%);
      background-size: 50px 50px;
      z-index: 3;
      pointer-events: none;
    }

    /* Ubicación y tamaño adaptativo del texto */
    .stage {
      position: absolute;
      top: 50%;
      right: 5%;
      transform: translateY(-50%);
      z-index: 4;
      pointer-events: none;
      width: 90vw;
      max-width: 420px;
      padding: 15px;
    }

    /* Texto ajustado para encajar bien */
    .target-text {
      color: #ffffff;
      font-size: 1.1rem;   /* Tamaño adecuado para que quepa todo */
      font-weight: 500;
      line-height: 1.45;   /* Espaciado óptimo entre líneas */
      text-align: center;
      letter-spacing: 0.5px;
      text-shadow: 
        0 0 8px rgba(255, 105, 180, 0.8),
        0 0 15px rgba(255, 20, 147, 0.6),
        0 2px 5px rgba(0, 0, 0, 0.9);
      
      /* Animación de entrada */
      opacity: 0;
      animation: 
        fadeInText 1.5s ease-out 1.2s forwards,
        pulseGlow 2.5s ease-in-out 2.7s infinite alternate;
    }

    /* Adaptación específica para pantallas de móvil */
    @media (max-width: 600px) {
      .stage {
        right: 50%;
        transform: translate(50%, -50%);
        top: 50%;
      }

      .target-text {
        font-size: 0.98rem; /* Ajuste fino en móviles para que no se corte */
        line-height: 1.35;
      }
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseGlow {
      from { text-shadow: 0 0 8px #ff69b4, 0 0 15px #ff1493, 0 2px 4px #000; }
      to { text-shadow: 0 0 15px #ff69b4, 0 0 25px #ff1493, 0 0 35px #ff1493; }
    }

    /* Indicación interactiva en la parte inferior */
    .hint-text {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 5;
      pointer-events: none;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    /* Canvas para lluvia de corazones */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="escena-container">
    <video class="video-fondo" autoplay loop muted playsinline poster="watermarked_img_8387707361316072357.png">
      <source src="animacion_asesino.mp4" type="video/mp4">
    </video>
  </div>

  <div class="animus-bg"></div>

  <div class="stage">
    <div class="target-text">
      Para el chico más bonito ❤️<br><br>
      Recuerda que eres increíble y que siempre estaré aquí para ti. 💖<br><br>
      Tu sonrisa ilumina mi mundo y tu corazón es un tesoro que valoro cada día. ✨<br><br>
      Nunca olvides lo especial que eres para mí. 🌟<br><br>
      ¡Tú puedes con todo! 💪✨
    </div>
  </div>

  <div class="hint-text">✨ Toca la pantalla ✨</div>

  <audio id="bgMusic" loop>
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <canvas id="heartCanvas"></canvas>

  <script>
    // --- Audio al primer toque ---
    const audio = document.getElementById('bgMusic');
    window.addEventListener('pointerdown', () => {
      if (audio && audio.paused) {
        audio.play().catch(err => console.log("Audio esperando interacción"));
      }
    }, { once: true });

    // --- Sistema de Partículas (Corazones) ---
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class HeartParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 18 + 10;
        this.speedX = (Math.random() - 0.5) * 6;
        this.speedY = (Math.random() - 0.5) * 6;
        this.opacity = 1;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 4;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.opacity -= 0.02;
        this.rotation += this.rotationSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.font = `${this.size}px serif`;
        ctx.fillText('💖', -this.size / 2, this.size / 2);
        ctx.restore();
      }
    }

    function createHeartBurst(x, y) {
      const count = 12;
      for (let i = 0; i < count; i++) {
        particles.push(new HeartParticle(x, y));
      }
    }

    window.addEventListener('pointerdown', (e) => {
      createHeartBurst(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (e.buttons === 1) {
        createHeartBurst(e.clientX, e.clientY);
      }
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].opacity <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
